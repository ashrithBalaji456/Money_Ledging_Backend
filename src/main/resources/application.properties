spring.application.name=money-lending-app
server.port=8080

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Money_Lending}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:secret123secret123secret123secret123secret123secret123}
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://money-ledging-frontend.vercel.app,https://*.vercel.app}

# Enable request logging
logging.level.org.springframework.web=INFO
logging.level.com.example.lending=DEBUG
